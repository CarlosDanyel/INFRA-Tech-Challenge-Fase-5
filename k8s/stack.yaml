apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: fiapx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:12.1.1
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: GRAFANA_PASSWORD
        volumeMounts:
        - name: data
          mountPath: /var/lib/grafana
        - name: datasource
          mountPath: /etc/grafana/provisioning/datasources/datasource.yml
          subPath: datasource.yml
          readOnly: true
        - name: dashboard-provider
          mountPath: /etc/grafana/provisioning/dashboards/provider.yml
          subPath: provider.yml
          readOnly: true
        - name: dashboards
          mountPath: /etc/grafana/dashboards/fiapx.json
          subPath: fiapx.json
          readOnly: true
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: grafana-data
      - name: datasource
        configMap:
          name: grafana-datasource
      - name: dashboard-provider
        configMap:
          name: grafana-dashboard-provider
      - name: dashboards
        configMap:
          name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: fiapx
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
