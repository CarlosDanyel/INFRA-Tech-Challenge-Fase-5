apiVersion: apps/v1
kind: Deployment
metadata:
  name: video-api
  namespace: fiapx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: video-api
  template:
    metadata:
      labels:
        app: video-api
    spec:
      containers:
      - name: video-api
        image: fiapx/video-api:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: postgres
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: DB_PASSWORD
        - name: RABBIT_HOST
          value: rabbitmq
        - name: RABBIT_USER
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBIT_USER
        - name: RABBIT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: RABBIT_PASSWORD
        - name: S3_ENDPOINT
          value: http://minio:9000
        - name: S3_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: S3_ACCESS_KEY
        - name: S3_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: S3_SECRET_KEY
        - name: DB_NAME
          value: fiapx
        - name: REDIS_HOST
          value: redis
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: fiapx-secrets
              key: JWT_SECRET
        - name: REDIS_PORT
          value: '6379'
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8080
          initialDelaySeconds: 20
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8080
          initialDelaySeconds: 45
          periodSeconds: 20
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: '2'
            memory: 1Gi
---
apiVersion: v1
kind: Service
